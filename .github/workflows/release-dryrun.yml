name: Release Dry-Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dryrun.yml'
      - '.github/workflows/scorecard.yml'
      - 'packages/mcp-npm/**'
      - 'scripts/smoke-release-candidate.py'
      - 'scripts/smoke-native-candidate.py'
      - 'scripts/test_smoke_native_candidate.py'
      - 'Dockerfile'

permissions:
  contents: read

jobs:
  goreleaser-dryrun:
    name: GoReleaser dry-run (snapshot)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test candidate identity validation
        run: python3 -m unittest discover -s scripts -p test_smoke_native_candidate.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Run GoReleaser (snapshot, no publish)
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pack npm wrapper
        working-directory: packages/mcp-npm
        run: |
          cp ../../README.md README.md
          snapshot_version="$(node -p "require('../../dist/metadata.json').version")"
          npm version "$snapshot_version" --no-git-tag-version
          npm pack

      - name: Select GoReleaser Linux image
        id: image
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          artifacts = json.load(open('dist/artifacts.json'))
          images = [item['name'] for item in artifacts
                    if item.get('type') == 'Docker Image'
                    and item.get('goos') == 'linux'
                    and item.get('goarch') == 'amd64'
                    and re.fullmatch(r'proggarapsody/bitbottle:(?!latest)[^:]+-amd64', item.get('name', ''))]
          if len(images) != 1:
              raise SystemExit(f'expected one GoReleaser Linux image, found {images!r}')
          print('image=' + images[0])
          PY

      - name: Smoke Linux archive, npm install, and GoReleaser Docker MCP
        run: >-
          python3 scripts/smoke-release-candidate.py
          --archive dist/bitbottle_linux_amd64.tar.gz
          --checksums dist/checksums.txt
          --metadata dist/metadata.json
          --npm-tarball packages/mcp-npm/proggarapsody-bitbottle-*.tgz
          --artifacts dist/artifacts.json
          --docker-image "${{ steps.image.outputs.image }}"
          > "${{ runner.temp }}/candidate-smoke.json"

      # This proves the PR snapshot bytes only. release.yml rebuilds at the tag;
      # its published bytes need their own digest and post-publication binding.
      - name: Bind snapshot smoke evidence to workflow SHA
        run: |
          python3 -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/candidate-smoke.json"; d=json.load(open(p)); d["commit_sha"]=os.environ["GITHUB_SHA"]; d["go_version"]=os.popen("go version").read().strip(); open(p,"w").write(json.dumps(d,indent=2)+"\n")'
          cat "${{ runner.temp }}/candidate-smoke.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.3.4
        with:
          name: candidate-smoke
          path: ${{ runner.temp }}/candidate-smoke.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.3.4
        with:
          name: goreleaser-snapshot
          path: dist/
          retention-days: 3

  native-candidate:
    name: Native candidate (${{ matrix.target }})
    needs: goreleaser-dryrun
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux_amd64
            extension: tar.gz
          - runner: ubuntu-24.04-arm
            target: linux_arm64
            extension: tar.gz
          - runner: macos-15-intel
            target: darwin_amd64
            extension: tar.gz
          - runner: macos-15
            target: darwin_arm64
            extension: tar.gz
          - runner: windows-latest
            target: windows_amd64
            extension: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: goreleaser-snapshot
          path: dist
      - name: Smoke native archive without external credentials
        shell: bash
        run: >-
          python scripts/smoke-native-candidate.py
          --archive dist/bitbottle_${{ matrix.target }}.${{ matrix.extension }}
          --checksums dist/checksums.txt --metadata dist/metadata.json
          --expected-sha "$GITHUB_SHA" --target "${{ matrix.target }}"
          --output native-smoke.json
      - name: Upload native smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.3.4
        with:
          name: native-smoke-${{ matrix.target }}
          path: native-smoke.json
          if-no-files-found: error
          retention-days: 30

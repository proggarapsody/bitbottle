name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to verify (e.g. v1.136.0)'
        required: true
      publish:
        description: 'Publish the verified files after checking live Cloud evidence'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  candidate:
    uses: ./.github/workflows/release-candidate.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      source_ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
  publish:
    needs: candidate
    if: >-
      github.repository == 'proggarapsody/bitbottle' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
      tag: ${{ needs.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require unchanged remote tag on main and exact-SHA live Cloud proof
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_TAG: ${{ needs.candidate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch origin main --tags
          test "$(git rev-parse "refs/tags/$CANDIDATE_TAG^{commit}")" = "$CANDIDATE_SHA"
          remote_tag="$(git ls-remote origin "refs/tags/$CANDIDATE_TAG" "refs/tags/$CANDIDATE_TAG^{}")"
          export REMOTE_TAG="$remote_tag"
          python3 -c 'import os; rows=[r.split() for r in os.environ["REMOTE_TAG"].splitlines()]; peeled=[r[0] for r in rows if r[1].endswith("^{}")]; direct=[r[0] for r in rows if not r[1].endswith("^{}")]; assert (peeled or direct)==[os.environ["CANDIDATE_SHA"]], "remote tag changed or is missing"'
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          python3 scripts/verify_release_cloud.py --sha "$CANDIDATE_SHA" --repo "$GH_REPO"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-evidence-*
          merge-multiple: true
          path: evidence
      - name: Verify publication inputs before registry authentication
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_TAG: ${{ needs.candidate.outputs.tag }}
        run: >-
          python3 scripts/release_candidate.py verify --candidate-dir candidate --evidence-dir evidence
          --sha "$CANDIDATE_SHA" --tag "$CANDIDATE_TAG"
      - name: Bind provenance subjects to the verified release assets
        id: subjects
        run: |
          python3 - <<'PY_SUBJECTS' >> "$GITHUB_OUTPUT"
          import base64, hashlib
          from pathlib import Path
          files = (Path('candidate/candidate-manifest.json'),
                   Path('candidate/dist/checksums.txt'), Path('candidate/sbom.spdx.json'))
          subjects = ''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files)
          print('hashes=' + base64.b64encode(subjects.encode()).decode())
          PY_SUBJECTS
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Authenticate Docker publisher
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          printf '%s' "$DOCKER_PASSWORD" | skopeo login --username proggarapsody --password-stdin docker.io
      - name: Publish only the sealed files already verified on all targets
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_TAG: ${{ needs.candidate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          python3 scripts/release_candidate.py publish --candidate-dir candidate --evidence-dir evidence
          --sha "$CANDIDATE_SHA" --tag "$CANDIDATE_TAG" --execute

  provenance:
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.publish.outputs.tag }}

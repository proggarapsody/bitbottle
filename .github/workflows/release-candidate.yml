name: Verify sealed release candidate
on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''
    outputs:
      sha:
        value: ${{ jobs.prepare.outputs.sha }}
      tag:
        value: ${{ jobs.prepare.outputs.tag }}
      artifact:
        value: ${{ jobs.prepare.outputs.artifact }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      artifact: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin candidate identity
        id: identity
        env:
          PROPOSED_TAG: ${{ inputs.tag }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          tag="$PROPOSED_TAG"
          if [ -z "$tag" ]; then
            tag="v$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Local tag only: exercise the real release version without pushing a tag.
          git tag -f "$tag" "$source_sha"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Test candidate validators
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Require public operation evidence
        run: python3 scripts/qa_matrix.py --run --packages ./... --output "${{ runner.temp }}/release-evidence/qa-matrix" --require-critical
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build release files once, without publishing
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reject source changes from build hooks
        run: git diff --exit-code
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Pack candidate files once
        env:
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
          CANDIDATE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          mkdir -p candidate/npm
          mv dist candidate/dist
          cp README.md packages/mcp-npm/README.md
          cd packages/mcp-npm
          npm version "${CANDIDATE_TAG#v}" --no-git-tag-version
          npm pack --pack-destination ../../candidate/npm
          cd ../..
          python3 scripts/release_oci.py export --candidate-dir candidate --tag "$CANDIDATE_TAG"
          skopeo copy --all --preserve-digests oci:candidate/docker:candidate "oci:$RUNNER_TEMP/oci-transport-proof:candidate"
          PYTHONPATH=scripts python3 - <<'PY_OCI'
          import os
          from pathlib import Path
          from release_oci import inspect_layout
          original = inspect_layout('candidate/docker')
          transported = inspect_layout(Path(os.environ['RUNNER_TEMP']) / 'oci-transport-proof')
          assert original == transported, 'OCI index, architecture manifest, or config changed in transport'
          print('OCI transport preserved the combined index and both architecture identities')
          PY_OCI
          cp candidate/dist/CHANGELOG.md candidate/release-notes.md
          cat docs/quality/release-limitations.md >> candidate/release-notes.md
      - name: Generate the candidate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: candidate/dist
          output-file: candidate/sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Seal all candidate bytes including the SBOM
        env:
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
          CANDIDATE_TAG: ${{ steps.identity.outputs.tag }}
        run: >-
          python3 scripts/release_candidate.py seal --candidate-dir candidate
          --sha "$CANDIDATE_SHA" --tag "$CANDIDATE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.3.4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.3.4
        if: always()
        with:
          name: release-evidence-qa
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux_amd64, arch: amd64, extension: tar.gz }
          - { runner: ubuntu-24.04-arm, target: linux_arm64, arch: arm64, extension: tar.gz }
          - { runner: macos-15-intel, target: darwin_amd64, extension: tar.gz }
          - { runner: macos-15, target: darwin_arm64, extension: tar.gz }
          - { runner: windows-latest, target: windows_amd64, extension: zip }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: candidate
      - name: Verify native archive
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p evidence
          python scripts/smoke-native-candidate.py \
            --archive candidate/dist/bitbottle_${{ matrix.target }}.${{ matrix.extension }} \
            --checksums candidate/dist/checksums.txt --metadata candidate/dist/metadata.json \
            --expected-sha "$CANDIDATE_SHA" --target ${{ matrix.target }} \
            --candidate-manifest candidate/candidate-manifest.json \
            --output evidence/native-smoke-${{ matrix.target }}.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Verify packed npm and sealed Docker image natively
        if: runner.os == 'Linux'
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          python3 scripts/release_oci.py import --candidate-dir candidate --tag "$CANDIDATE_TAG" --arch ${{ matrix.arch }}
          python3 scripts/smoke-release-candidate.py \
            --archive candidate/dist/bitbottle_${{ matrix.target }}.tar.gz \
            --checksums candidate/dist/checksums.txt --metadata candidate/dist/metadata.json \
            --npm-tarball candidate/npm/*.tgz --artifacts candidate/dist/artifacts.json \
            --docker-image "proggarapsody/bitbottle:$CANDIDATE_TAG-${{ matrix.arch }}" \
            --target ${{ matrix.target }} --expected-sha "$CANDIDATE_SHA" \
            --oci-layout candidate/docker --candidate-manifest candidate/candidate-manifest.json > evidence/candidate-smoke-${{ matrix.target }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.3.4
        with:
          name: release-evidence-${{ matrix.target }}
          path: evidence/
          if-no-files-found: error
  verify:
    needs: [prepare, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-evidence-*
          merge-multiple: true
          path: evidence
      - name: Verify sealed bytes and produce publication plan without writes
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/release_candidate.py publish --candidate-dir candidate --evidence-dir evidence \
            --sha "$CANDIDATE_SHA" --tag "$CANDIDATE_TAG" > publication-plan.json
          cat publication-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.3.4
        with:
          name: publication-plan
          path: publication-plan.json

version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - noctx
    - bodyclose
    - depguard
  settings:
    depguard:
      rules:
        pkg-cmd-layer-boundary:
          # pkg/cmd/** must talk to api/backend interfaces only.
          # Exceptions: factory (composition root) and integration tests.
          files:
            - "**/pkg/cmd/**/*.go"
            - "!**/pkg/cmd/factory/*.go"
            - "!**/pkg/cmd/factory/**/*.go"
            - "!**/*_integration_test.go"
          deny:
            - pkg: "github.com/proggarapsody/bitbottle/api/cloud"
              desc: "pkg/cmd must import api/backend interfaces only; direct cloud adapter use belongs in pkg/cmd/factory"
            - pkg: "github.com/proggarapsody/bitbottle/api/server"
              desc: "pkg/cmd must import api/backend interfaces only; direct server adapter use belongs in pkg/cmd/factory"
            - pkg: "github.com/proggarapsody/bitbottle/api/cloud/gen"
              desc: "gen packages are adapter-internal; pkg/cmd must not import them"
            - pkg: "github.com/proggarapsody/bitbottle/api/server/gen"
              desc: "gen packages are adapter-internal; pkg/cmd must not import them"
        gen-layer-boundary:
          # api/backend/, api/internal/, and cross-adapter files must not import gen packages.
          files:
            - "**/api/backend/**/*.go"
            - "**/api/internal/**/*.go"
          deny:
            - pkg: "github.com/proggarapsody/bitbottle/api/cloud/gen"
              desc: "gen packages are adapter-internal; api/backend and api/internal must not import them"
            - pkg: "github.com/proggarapsody/bitbottle/api/server/gen"
              desc: "gen packages are adapter-internal; api/backend and api/internal must not import them"
        cross-adapter-boundary:
          # api/cloud/** must not import api/server/gen; api/server/** must not import api/cloud/gen.
          files:
            - "**/api/cloud/**/*.go"
          deny:
            - pkg: "github.com/proggarapsody/bitbottle/api/server/gen"
              desc: "gen packages are adapter-internal; api/cloud must not import api/server/gen"
        cross-adapter-boundary-server:
          # api/server/** must not import api/cloud/gen.
          files:
            - "**/api/server/**/*.go"
          deny:
            - pkg: "github.com/proggarapsody/bitbottle/api/cloud/gen"
              desc: "gen packages are adapter-internal; api/server must not import api/cloud/gen"
        no-raw-http-in-cmd:
          # pkg/cmd/** production code must not use net/http directly — use api/internal/httpx
          # Transport or backend interfaces. See docs/ARCHITECTURE.md §Anti-patterns.
          # Test files are exempted: httptest servers in tests are legitimate.
          files:
            - "**/pkg/cmd/**/*.go"
            - "!**/*_test.go"               # test files may use httptest for local stubs
            - "!**/pkg/cmd/api/**"          # raw API passthrough — product feature
            - "!**/pkg/cmd/auth/login.go"   # pre-auth TLS probe — no host config yet
            - "!**/pkg/cmd/factory/**"       # composition root — instantiates concrete adapters
          deny:
            - pkg: "net/http"
              desc: "Use api/internal/httpx Transport or backend interfaces. See docs/ARCHITECTURE.md §Anti-patterns."
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - "reference/"
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/proggarapsody/bitbottle

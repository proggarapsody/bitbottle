name: Release Dry-Run
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Proposed version tag; empty uses the release manifest version'
        required: false
        default: ''
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/scorecard.yml'
      - 'packages/mcp-npm/**'
      - 'scripts/*release*candidate*.py'
      - 'scripts/*native*candidate*.py'
      - 'scripts/*release*oci*.py'
      - 'scripts/*release*cloud*.py'
      - 'docs/quality/release-limitations.md'
      - 'Dockerfile'
permissions:
  contents: read
jobs:
  candidate:
    uses: ./.github/workflows/release-candidate.yml
    with:
      tag: ${{ inputs.tag || '' }}
      source_ref: ${{ github.sha }}

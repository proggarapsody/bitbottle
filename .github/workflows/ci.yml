name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: github.head_ref != 'release-please--branches--main'
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        if: github.head_ref != 'release-please--branches--main'
        run: go test -coverprofile=coverage.out -race -shuffle=on ./...

      - name: Upload coverage
        if: github.head_ref != 'release-please--branches--main'
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

      - name: Skip notice (release-please PR)
        if: github.head_ref == 'release-please--branches--main'
        run: echo "Skipping tests on release-please PR — diff is CHANGELOG/manifest only, feature CI already vetted main."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: github.head_ref != 'release-please--branches--main'
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache golangci-lint
        if: github.head_ref != 'release-please--branches--main'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.golangci.yml', '.golangci.yaml') }}-v2.11.4
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: golangci-lint
        if: github.head_ref != 'release-please--branches--main'
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Skip notice (release-please PR)
        if: github.head_ref == 'release-please--branches--main'
        run: echo "Skipping lint on release-please PR — diff is CHANGELOG/manifest only, feature CI already vetted main."

  build:
    name: Build
    runs-on: ubuntu-latest
    # Plain `go build` is skipped on release PRs (diff is CHANGELOG/manifest only,
    # already covered by feature-PR build). The actual pre-tag gate that catches
    # GoReleaser-specific failures is the `release-config-check` job below.
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: github.head_ref != 'release-please--branches--main'
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        if: github.head_ref != 'release-please--branches--main'
        run: go build ./cmd/bitbottle

      - name: Skip notice (release-please PR)
        if: github.head_ref == 'release-please--branches--main'
        run: echo "Skipping plain build on release-please PR — release-config-check runs goreleaser snapshot as the pre-tag gate."

  release-config-check:
    name: Release config
    runs-on: ubuntu-latest
    # Pre-tag gate: validate .goreleaser.yml + snapshot build on release-please PRs.
    # Catches GoReleaser-specific failures (build flags, matrix, hooks) that plain
    # `go build` misses. Only runs on release PRs; cheap to add (~45s).
    if: github.head_ref == 'release-please--branches--main'
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: check

      - name: Snapshot build (current platform)
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: build --snapshot --single-target --clean

  smell-scan:
    name: Smell scan
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 50

      - name: Architecture smell scan
        run: bash scripts/smell-scan.sh

  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run auto-iter script tests
        run: make test-scripts

name: Release Dry-Run

on:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dryrun.yml'
      - '.github/workflows/scorecard.yml'
      - 'packages/mcp-npm/**'

permissions:
  contents: read

jobs:
  goreleaser-dryrun:
    name: GoReleaser dry-run (snapshot)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Run GoReleaser (snapshot, no publish)
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.4
        with:
          name: goreleaser-snapshot
          path: dist/
          retention-days: 3

  npm-dryrun:
    name: npm publish dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Copy README (mirrors real release step)
        working-directory: packages/mcp-npm
        run: cp ../../README.md README.md

      # npm pack validates the package.json fields and files list without the
      # strict publication checks that npm publish --dry-run enforces in npm v11.
      # Proves the tarball is buildable and contains the expected files.
      - name: npm pack (dry-run equivalent)
        working-directory: packages/mcp-npm
        run: |
          npm pack
          tar tf ./*.tgz
